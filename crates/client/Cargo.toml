[package]
name = "client"
version = "0.1.0"
description = "web-phone system's CLI client"
edition = "2024"

[dependencies]
clap = { version = "4.5.43", features = ["derive", "string"] }
confy = "1.0.0"
directories = "6.0.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
