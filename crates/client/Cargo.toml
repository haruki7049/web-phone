[package]
name = "client"
version = "0.1.0"
description = "WebTransport client for real-time audio transmission"
edition = "2024"

[dependencies]
clap = { version = "4.5.43", features = ["derive", "string"] }
confy = "1.0.0"
cpal = "0.16.0"
directories = "6.0.0"
rustls = "0.23"
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.44.1", features = ["rt-multi-thread", "net", "sync", "macros"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
wtransport = { version = "0.6.1", features = ["dangerous-configuration"] }
