[package]
name = "client"
version = "0.1.0"
description = "web-phone system's client with message viewer and daemon functionality"
edition = "2024"

[dependencies]
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5.43", features = ["derive", "string"] }
directories = "6.0.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tungstenite = "0.27.0"
