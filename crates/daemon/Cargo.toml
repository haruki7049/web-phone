[package]
name = "daemon"
version = "0.1.0"
description = "WebTransport server for real-time audio transmission"
edition = "2024"

[dependencies]
clap = { version = "4.5.43", features = ["derive", "string"] }
confy = "1.0.0"
directories = "6.0.0"
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.44.1", features = ["rt-multi-thread", "net", "sync", "macros"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
wtransport = "0.6.1"
