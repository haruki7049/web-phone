[workspace]
resolver = "3"
members = ["crates/wclient", "crates/wdaemon"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.metadata.crane]
name = "web-phone"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.7"
bytes = "1.0"
clap = { version = "4.5", features = ["derive", "string"] }
color-eyre = "0.6"
confy = "2.0"
cpal = "0.16.0"
directories = "6.0"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
stun = "0.4"
tokio = { version = "1.48", features = [
  "rt-multi-thread",
  "net",
  "sync",
  "macros",
  "io-util",
  "time",
] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
turn = "0.6"
webrtc = "0.8"
