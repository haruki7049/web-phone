[workspace]
resolver = "3"
members = ["crates/wpclient", "crates/wpdaemon", "crates/wpapi"]

[workspace.package]
version = "0.2.0-alpha.4"
edition = "2024"

[workspace.metadata.crane]
name = "web-phone"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
bytes = "1.12"
clap = { version = "4.6", features = ["derive", "string"] }
thiserror = "2.0"
color-eyre = "0.6"
confy = "2.0"
cpal = "0.18"
directories = "6.0"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls-native-certs",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"

tokio = { version = "1.53", features = [
  "rt-multi-thread",
  "net",
  "sync",
  "macros",
  "io-util",
  "time",
  "signal",
] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = "0.3"
webrtc = "0.20.5"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }

hmac = "0.13"
sha1 = "0.11"
base64 = "0.23"
hex = "0.4"
k256 = { version = "0.13", features = ["schnorr"] }
argon2 = "0.6"
aes-gcm = "0.11"
tempfile = "3.27"
rand = "0.8"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
