[workspace]
resolver = "3"
members = ["crates/wclient", "crates/wdaemon"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.metadata.crate]
name = "web-phone"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5.43", features = ["derive", "string"] }
confy = "1.0.0"
directories = "6.0.0"
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.44.1", features = [
  "rt-multi-thread",
  "net",
  "sync",
  "macros",
] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
wtransport = "0.6.1"
cpal = "0.16.0"
rustls = { version = "0.23", features = ["ring"] }
